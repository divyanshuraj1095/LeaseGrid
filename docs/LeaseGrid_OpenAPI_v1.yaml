    "title": "LeaseGrid API",
    "version": "1.0",
    "description": "LeaseGrid v1. Use a login access token in Authorize. Common responses include 400 for invalid input, 401 for missing or invalid credentials, 403 for insufficient permissions, 404 for inaccessible resources, 409 for conflicts, 422 for lease duration limits and 503 for database unavailability. Application errors include code and traceId. Authentication filters may return an empty body."
