name: LeaseGrid CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test with PostgreSQL Testcontainers
        run: sh mvnw -B verify
      - name: Build image
        run: docker build -t leasegrid:${{ github.sha }} .